<div class="row justify-content-center">
  <div class="col-8">
    <abf-alert-error />
    <abf-alert />

    @if (credential(); as credentialRef) {
      <h2 data-cy="credentialDetailsHeading"><span abfTranslate="hcAdminApp.platformCredential.detail.title">Account</span></h2>

      <hr />

      <dl class="row-md jh-entity-details">
        <dt><span abfTranslate="hcAdminApp.platformCredential.id">Login</span></dt>
        <dd>
          <span>{{ credentialRef.id }}</span>
        </dd>
        <dt><span abfTranslate="hcAdminApp.platformCredential.email">Email</span></dt>
        <dd>
          <span>{{ credentialRef.email }}</span>
        </dd>
        <dt><span abfTranslate="hcAdminApp.platformCredential.role">Role</span></dt>
        <dd>
          <span [abfTranslate]="'hcAdminApp.CredentialRole.' + (credentialRef.role ?? 'null')">{{ credentialRef.role }}</span>
        </dd>
        <dt><span abfTranslate="hcAdminApp.platformCredential.enabled">Enabled</span></dt>
        <dd>
          <span>{{ credentialRef.enabled }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span abfTranslate="entity.action.back">Back</span>
      </button>
    } @else if (!isLoading()) {
      <div class="alert alert-warning" id="no-account">
        <span abfTranslate="hcAdminApp.platformCredential.home.notFound">No account found</span>
      </div>
    }
  </div>
</div>
