<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (team(); as teamRef) {
      <div>
        <h2 data-cy="teamDetailsHeading"><span abfTranslate="hcAdminApp.platformTeam.detail.title">Team</span></h2>

        <hr />

        <abf-alert-error />

        <abf-alert />

        <dl class="row-md jh-entity-details">
          <dt><span abfTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ teamRef.id }}</span>
          </dd>
          <dt><span abfTranslate="hcAdminApp.platformTeam.name">Name</span></dt>
          <dd>
            <span>{{ teamRef.name }}</span>
          </dd>
          <dt><span abfTranslate="hcAdminApp.platformTeam.description">Description</span></dt>
          <dd>
            <span>{{ teamRef.description }}</span>
          </dd>
          <dt><span abfTranslate="hcAdminApp.platformTeam.supervisor">Supervisor</span></dt>
          <dd>
            @if (team()!.supervisor) {
              <div>
                <a [routerLink]="['/professional', team()!.supervisor?.id, 'view']">{{ teamRef.supervisor?.licenceNumber }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span abfTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/team', teamRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span abfTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
