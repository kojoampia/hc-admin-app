@if (planFeature) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(planFeature.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="planFeatureDeleteDialogHeading" abfTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <abf-alert-error />
      <p
        id="abf-delete-planFeature-heading"
        abfTranslate="hcAdminApp.cataloguePlanFeature.delete.question"
        [translateValues]="{ id: planFeature.id }"
      >
        Are you sure you want to delete Plan Feature {{ planFeature.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span abfTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="abf-confirm-delete-planFeature" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span abfTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
