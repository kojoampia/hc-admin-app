<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (address(); as addressRef) {
      <div>
        <h2 data-cy="addressDetailsHeading"><span>Address</span></h2>

        <hr />

        <abf-alert-error />

        <abf-alert />

        <dl class="row-md jh-entity-details">
          <dt><span>Digital Address</span></dt>
          <dd>
            <span>{{ addressRef.digitalAddress }}</span>
          </dd>
          <dt><span>Street Address</span></dt>
          <dd>
            <span>{{ addressRef.streetAddress }}</span>
          </dd>
          <dt><span>Town</span></dt>
          <dd>
            <span>{{ addressRef.town }}</span>
          </dd>
          <dt><span>District</span></dt>
          <dd>
            <span>{{ addressRef.district }}</span>
          </dd>
          <dt><span>City</span></dt>
          <dd>
            <span>{{ addressRef.city }}</span>
          </dd>
          <dt><span>Region</span></dt>
          <dd>
            <span>{{ addressRef.region }}</span>
          </dd>
          <dt><span>Country</span></dt>
          <dd>
            <span>{{ addressRef.country }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span abfTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/address', addressRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span abfTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
