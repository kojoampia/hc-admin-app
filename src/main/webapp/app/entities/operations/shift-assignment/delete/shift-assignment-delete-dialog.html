@if (shiftAssignment) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(shiftAssignment.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="shiftAssignmentDeleteDialogHeading" abfTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <abf-alert-error />
      <p
        id="abf-delete-shiftAssignment-heading"
        abfTranslate="hcAdminApp.operationsShiftAssignment.delete.question"
        [translateValues]="{ id: shiftAssignment.id }"
      >
        Are you sure you want to delete Shift Assignment {{ shiftAssignment.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span abfTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="abf-confirm-delete-shiftAssignment" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span abfTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
