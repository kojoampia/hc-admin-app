<header data-cy="topbar" class="abf-topbar">
  <button
    type="button"
    data-cy="menuToggle"
    class="icon-btn abf-topbar__menu"
    (click)="toggleSidebar()"
    [attr.aria-label]="'global.menu.toggle' | translate"
    [attr.aria-expanded]="isSidebarOpen()"
    aria-controls="abf-sidebar"
  >
    <fa-icon icon="bars" />
  </button>

  <!-- The desktop counterpart of the hamburger above: that one opens the mobile drawer, this one
       collapses the always-present sidebar to a rail. They occupy the same slot and are shown at
       opposite breakpoints, so exactly one is ever visible and there is one control to learn. -->
  <button
    type="button"
    data-cy="railToggle"
    class="icon-btn abf-topbar__rail"
    (click)="toggleSidebarCollapsed()"
    [attr.aria-label]="'global.menu.collapse' | translate"
    [attr.aria-expanded]="!isSidebarCollapsed()"
    aria-controls="abf-sidebar"
  >
    <fa-icon [icon]="isSidebarCollapsed() ? 'angles-right' : 'angles-left'" />
  </button>

  <div class="abf-topbar__heading">
    <div data-cy="breadcrumb" class="crumb">{{ breadcrumb() | translate }}</div>
    <h2 data-cy="pageTitle">{{ pageTitle() | translate }}</h2>
  </div>

  <div class="abf-topbar__actions no-print">
    <div ngbDropdown class="abf-topbar__bell-wrap" display="dynamic" placement="bottom-end">
      <button
        type="button"
        ngbDropdownToggle
        id="abf-notifications"
        class="icon-btn abf-topbar__bell"
        [attr.aria-label]="'global.menu.console.messageDesk' | translate"
        [title]="'global.menu.console.messageDesk' | translate"
        data-cy="notificationsBell"
      >
        <fa-icon icon="bell" />
        @if (notifications().length > 0) {
          <span class="badge">{{ notifications().length }}</span>
        } @else if (unreadMessages() > 0) {
          <span class="badge">{{ unreadMessages() }}</span>
        }
      </button>

      <div ngbDropdownMenu aria-labelledby="abf-notifications" class="abf-topbar__notifications">
        @for (event of notifications(); track event.id) {
          <button type="button" ngbDropdownItem (click)="openNotification(event)" data-cy="notificationItem">
            <span class="subject">{{ event.subject }}</span>
            <span class="from">{{ event.senderName ?? event.fromAddress }}</span>
          </button>
        } @empty {
          <span ngbDropdownItem class="muted" abfTranslate="messageDesk.notifications.empty">Nothing new.</span>
        }
        <div class="dropdown-divider"></div>
        <a ngbDropdownItem routerLink="/message-desk" abfTranslate="messageDesk.notifications.all">Open the message desk</a>
      </div>
    </div>

    <button
      type="button"
      class="icon-btn"
      (click)="print()"
      [attr.aria-label]="'global.action.print' | translate"
      [title]="'global.action.print' | translate"
    >
      <fa-icon icon="print" />
    </button>

    <div ngbDropdown class="d-inline-block" *abfHasAnyAuthority="quickAddAuthorities">
      <button type="button" class="btn btn-primary abf-topbar__new" ngbDropdownToggle id="abf-quick-add">
        <fa-icon icon="plus" />
        <span abfTranslate="global.action.new">New</span>
      </button>
      <div ngbDropdownMenu aria-labelledby="abf-quick-add" class="abf-topbar__new-menu">
        @for (item of quickAdd; track item.route) {
          <a ngbDropdownItem [routerLink]="item.route">
            <fa-icon [icon]="item.icon" />
            <span>{{ item.label | translate }}</span>
          </a>
        }
      </div>
    </div>
  </div>
</header>
