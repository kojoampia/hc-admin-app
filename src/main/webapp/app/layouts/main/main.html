@if (isAuthenticated()) {
  <div class="abf-shell">
    <router-outlet name="navbar" />

    <div class="abf-main">
      <abf-topbar />
      <main class="abf-content">
        <router-outlet />
      </main>
    </div>
  </div>

  <abf-tabbar />
} @else {
  <!-- Signed out: the login screen owns the whole viewport, no chrome. -->
  <router-outlet />
}
