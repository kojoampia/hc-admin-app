<div>
  <div class="abf-row">
    <!-- The JHipster mascot art that used to sit beside this message is gone with the generated
         home page. It had never rendered here anyway: `.hipster` was defined in home.scss, Angular
         scopes a component's styles, and error.ts declares no styleUrl — so this was an empty
         zero-height span for as long as the screen has existed. -->
    <div class="col-md-12">
      <h1 abfTranslate="error.title">Error page!</h1>

      @if (errorMessage(); as errMessage) {
        <div class="alert alert-danger">{{ errMessage }}</div>
      }
    </div>
  </div>
</div>
