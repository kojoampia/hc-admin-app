# The quality gate for the console client. Lints, type-checks, runs the Vitest suite, and proves the
# production bundle still builds.
#
# --- Why this repo had no CI until now -------------------------------------------------------------
#
# It is the newest of the four and was developed against an in-browser mock, with no backend to
# integrate against and so nothing forcing the question. The other three (hc-admin-service, hc-admin-gateway, hc-admin-dashboard) each have a
# ci.yml on this shape; this one deliberately matches them so a red build reads the same way
# wherever it happens.
#
# --- What `npm test` covers, and what it does not --------------------------------------------------
#
# `pretest` runs eslint, so `npm test` is lint + Vitest in one step. That is deliberate and matches
# hc-admin-dashboard: a suite there was red for a long time precisely because lint failed first and
# nobody noticed the tests had therefore never run. If lint and tests are ever split, keep both
# blocking.
#
# eslint here carries the prettier plugin, so formatting is checked by the same step. There is no
# separate `prettier:check` job for that reason — adding one would double the failure surface for
# one class of problem.
#
# `tsc -p tsconfig.spec.json` is NOT redundant with either. tsconfig.app.json only type-checks what
# is reachable from main.ts, so the specs and anything reached only from them would go unchecked.
#
# --- E2E is not run here, and that is now a division of labour rather than a gap -------------------
#
# It runs in e2e.yml, since 2026-09-05: the Cypress specs against a real gateway, admin service and
# Mongo from deploy/e2e/compose.yml, with the console served by the image that would ship.
#
# This paragraph said the opposite for as long as this file existed, and the reason is worth keeping.
# `pree2e:headless` invoked `npm run ci:server:await`, and that script — along with `app:start` and
# `ci:e2e:server:start`, both referenced by the e2e scripts — was defined nowhere, so
# `npm run e2e:headless` died in its pre-hook before cypress started. Ten real specs sat in the
# repository and had never run. Two defects reached main because of it in one week, both found by
# hand on the quality stack (backlog item 15). **A note inside a file that does not run is not a
# place work gets picked up from** — that gap sat here, documented, for a month.
#
# The two workflows stay separate on purpose. This one is minutes and needs nothing but a runner;
# that one builds an image and stands up three containers. Folding them together would make every
# lint failure wait on a stack, and every stack failure look like a lint gate.
name: CI

on:
  push:
    branches: [main]

  # --- No `branches:` filter here, and that is item 37 reopening an item 16 decision --------------
  #
  # `pull_request: branches:` matches the pull request's BASE. While this said `[main]`, a stacked
  # pull request — one opened onto another feature branch — matched neither trigger and NO WORKFLOW
  # RAN AT ALL. Measured on hc-admin-gateway PR #53 (base `chore/ci-probe-item-16`, head `c7ab8dfb`):
  # zero check runs, zero workflow runs, `mergeable_state: clean`. GitHub renders that as an ABSENCE
  # of checks, which is indistinguishable from a repository with no CI, so a reviewer approving that
  # diff gets no signal that nothing tested it. This repository has already been bitten once — PR #79
  # was stacked, got no CI, and was dispatched by hand only because somebody looked (item 16) — and
  # hc-patient paid it for real on 2026-09-08, their api PR #39 reporting CLEAN for days.
  #
  # Item 16 rejected removing this filter on 2026-09-03, because "dropping the `branches` filter
  # spends CI on drafts and spikes". Re-taken 2026-09-09 on measurement, because that cost is not
  # what it sounds like — this filter is the ONLY thing removed, and `push:` above keeps its own:
  #
  #   - Spikes cost nothing. A branch with no pull request open triggers nothing here either way,
  #     because CI runs on no feature-branch push. A spike that HAS a pull request open is a spike
  #     under review, which is exactly the case this change exists to gate.
  #   - Drafts already cost this. `pull_request` fires for a draft today; there is no draft filter in
  #     this file and never has been. Removing a BASE filter changes nothing about them.
  #   - The historical delta is one pull request. Of the 245 ever opened across hc-admin-service,
  #     hc-admin-gateway and hc-admin-app, exactly ONE had a base other than `main` — item 16's own
  #     probe, and it was not in this repository. Runs here are ~2 minutes and `concurrency` below
  #     collapses a push storm to one.
  #
  # DO NOT add `if: github.event.pull_request.draft == false` to the job below to "mitigate drafts".
  # It reintroduces item 16's defect on `main`, in green rather than as an absence, and the mechanism
  # is documented rather than suspected. A job skipped by an `if:` still reports a check run, with
  # conclusion `skipped`; GitHub's rule is that required status checks "must have a successful,
  # SKIPPED, or neutral status" to permit a merge. So `Lint, type-check and test` — required by
  # ruleset 22354481 — would be SATISFIED by a run that tested nothing. Marking the draft ready does
  # not repair it: `ready_for_review` is not one of the default activity types (`opened`,
  # `synchronize`, `reopened`), so no second run happens and the pull request becomes mergeable
  # carrying the draft phase's skip. Anything of that shape needs `types:` widened in step, which is
  # a second thing to keep correct for a cost measured at zero.
  #
  # WHAT THIS DOES NOT DO: the check now RUNS on a stacked pull request, it does not BLOCK one. The
  # ruleset is scoped to `~DEFAULT_BRANCH`, so merging into a feature branch is still a push to an
  # unprotected ref. Do not reach for `~ALL` to close that — item 37 explains at length why it is
  # worse, and this change does not alter the reason: CI still runs on no feature-branch push, so a
  # check required on every ref is a check that never reports on any of them.
  pull_request:

  workflow_dispatch:

concurrency:
  # Supersede an in-flight run for the same ref: only the newest commit's result is interesting.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json engines: node >=24.18.0. Angular 21 also accepts 20/22, but the floor here
          # is the one this project declares, so honour it rather than the framework's wider range.
          node-version: 24
          cache: npm

      # `ci`, not `install`: the lockfile is the input, and a gate that silently resolves different
      # versions than a local run is not a gate.
      #
      # No --legacy-peer-deps, unlike hc-admin-dashboard. That flag is needed there because the tree
      # pins jest 30 against a peerOptional jest ^29. This tree has no jest — it runs Vitest through
      # @angular/build:unit-test — and `npm ci` resolves clean. Do not add the flag speculatively: it
      # would mask a genuine peer conflict the day one appears.
      - name: Install
        run: npm ci

      # Runs before the suite: a compile error in a spec surfaces through Vitest as an opaque
      # "Failed to load" from the esbuild plugin, so surfacing it plainly is cheaper to read.
      #
      # --composite false is required, not cosmetic: tsconfig.spec.json is a composite project and
      # `--noEmit` alone fails with TS6304 before type-checking anything.
      - name: Type-check
        run: npx tsc -p tsconfig.spec.json --noEmit --composite false

      # eslint via pretest, then Vitest with coverage.
      - name: Lint and test
        run: npm test

      # The suite passing does not prove the production bundle builds: different tsconfig, different
      # optimiser, and templates are only fully checked here.
      - name: Production build
        run: npm run webapp:build:prod

      # --omit=dev, because a build-time advisory is not a shipped one and this gate has to stay
      # actionable.
      #
      # This BLOCKS, and the production tree is at zero vulnerabilities of any severity. It carried
      # continue-on-error for exactly two commits, while the tree still had GHSA-jj27-h5hq-8x99 — an
      # XSS in @angular/compiler's i18n handling affecting <21.2.19, which flagged eight @angular/*
      # packages through it. The 21.2.19 bump in this same PR cleared it.
      #
      # Do not reinstate the flag to make a red build green. That is the failure mode it existed to
      # avoid, and hc-admin-dashboard's copy of this file carries the same warning for the same
      # reason.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/test-results/
          retention-days: 7
